openapi: 3.0.3
info:
  title: Flea Market System API
  version: 1.0.0
  description: |
    API definition for the Flea Market Matching Application.
    Provides endpoints for users (buyers/sellers) and administrators.
servers:
  - url: http://localhost:8080/api/v1
    description: Local Development Server

paths:
  # ============================
  # My Page Endpoints
  # ============================
  /my-page:
    get:
      tags: [MyPage]
      summary: Get my profile
      description: Returns the authenticated user's profile information.
      security:
        - Bearer: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

    post:
      tags: [MyPage]
      summary: Update profile
      description: Update user name and profile image.
      security:
        - Bearer: []
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                name:
                  type: string
                profileImage:
                  type: string
                  format: binary
                  description: Profile image file
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  isSuccess:
                    type: boolean
                  errorMessage:
                    type: string

  /my-page/orders:
    get:
      tags: [MyPage]
      summary: Get purchase history
      description: Returns a list of items purchased by the user.
      security:
        - Bearer: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  orders:
                    type: array
                    items:
                      $ref: "#/components/schemas/AppOrder"

  /my-page/sales:
    get:
      tags: [MyPage]
      summary: Get sales history
      description: Returns a list of items sold by the user.
      security:
        - Bearer: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  records:
                    type: array
                    items:
                      $ref: "#/components/schemas/AppOrder"

  /my-page/selling:
    get:
      tags: [MyPage]
      summary: Get selling items
      description: Returns items currently listed by the user.
      security:
        - Bearer: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  sellingItems:
                    type: array
                    items:
                      $ref: "#/components/schemas/Item"

  /my-page/sold:
    get:
      tags: [MyPage]
      summary: Get sold items
      description: Returns items that have been sold by the user.
      security:
        - Bearer: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  soldItems:
                    type: array
                    items:
                      $ref: "#/components/schemas/Item"

  /my-page/favorites:
    get:
      tags: [MyPage]
      summary: Get favorite items
      description: Returns a list of items favorited by the user.
      security:
        - Bearer: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  favoriteItems:
                    type: array
                    items:
                      $ref: "#/components/schemas/Item"
    post:
      tags: [MyPage]
      summary: Add to favorites
      security:
        - Bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                itemId:
                  type: integer
                  format: int64
      responses:
        "200":
          description: OK
    delete:
      tags: [MyPage]
      summary: Remove from favorites
      security:
        - Bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                itemId:
                  type: integer
                  format: int64
      responses:
        "200":
          description: OK

  # ============================
  # Item Endpoints
  # ============================
  /items:
    get:
      tags: [Items]
      summary: Search items
      description: Retrieve a list of items with optional filters.
      parameters:
        - name: keyword
          in: query
          schema:
            type: string
          description: Search keyword for item name or description.
        - name: categoryId
          in: query
          schema:
            type: integer
            format: int64
          description: Filter by category ID.
        - name: minPrice
          in: query
          schema:
            type: number
          description: Minimum price filter.
        - name: maxPrice
          in: query
          schema:
            type: number
          description: Maximum price filter.
        - name: status
          in: query
          schema:
            type: string
            enum: [出品中, 販売済]
          description: Filter by item status.
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Item"
                  totalPages:
                    type: integer
                  currentPage:
                    type: integer
                  totalItems:
                    type: integer

    post:
      tags: [Items]
      summary: Create new item
      security:
        - Bearer: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [name, price, categoryId]
              properties:
                name:
                  type: string
                description:
                  type: string
                price:
                  type: number
                categoryId:
                  type: integer
                  format: int64
                image:
                  type: string
                  format: binary
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"

  /items/{id}:
    get:
      tags: [Items]
      summary: Get item details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
        "404":
          description: Not Found

    put:
      tags: [Items]
      summary: Update item
      security:
        - Bearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                price:
                  type: number
                categoryId:
                  type: integer
                  format: int64
                image:
                  type: string
                  format: binary
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"

    delete:
      tags: [Items]
      summary: Delete item
      security:
        - Bearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: Deleted

  /items/{id}/favorite:
    post:
      tags: [Items]
      summary: Add to favorites (by ID)
      security:
        - Bearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: OK
    delete:
      tags: [Items]
      summary: Remove from favorites (by ID)
      security:
        - Bearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: OK

  /items/{id}/report:
    post:
      tags: [Items]
      summary: Report a user/item
      description: Report the seller of this item for inappropriate behavior.
      security:
        - Bearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  description: Reason for the report
      responses:
        "200":
          description: Report submitted

  # ============================
  # Order Endpoints
  # ============================
  /orders:
    get:
      tags: [Orders]
      summary: Get all orders (admin or user context)
      security:
        - Bearer: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AppOrder"

    post:
      tags: [Orders]
      summary: Create an order (Purchase item)
      security:
        - Bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [itemId]
              properties:
                itemId:
                  type: integer
                  format: int64
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppOrder"

  /orders/{id}/ship:
    post:
      tags: [Orders]
      summary: Mark order as shipped
      security:
        - Bearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Shipped

  /orders/{id}/receive:
    post:
      tags: [Orders]
      summary: Confirm order receipt
      description: Mark the order as received by the buyer.
      security:
        - Bearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Received

  # ============================
  # Review & Chat Endpoints
  # ============================
  /reviews:
    post:
      tags: [Reviews]
      summary: Post a review
      security:
        - Bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderId, rating]
              properties:
                orderId:
                  type: integer
                  format: int64
                rating:
                  type: integer
                  minimum: 1
                  maximum: 5
                comment:
                  type: string
      responses:
        "200":
          description: Review submitted

  /chat/{itemId}:
    get:
      tags: [Chat]
      summary: Get chat messages for an item
      security:
        - Bearer: []
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Chat"

    post:
      tags: [Chat]
      summary: Send a chat message
      security:
        - Bearer: []
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
      responses:
        "200":
          description: Message sent

  # ============================
  # Admin Endpoints
  # ============================
  /admin/users:
    get:
      tags: [Admin]
      summary: List users
      security:
        - Bearer: []
      parameters:
        - name: q
          in: query
          schema:
            type: string
        - name: sort
          in: query
          schema:
            type: string
            enum: [id, name, email, banned]
            default: id
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"

  /admin/users/{id}:
    get:
      tags: [Admin]
      summary: Get user details
      security:
        - Bearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

    post:
      tags: [Admin]
      summary: Update user details
      description: Update user information (name, email, role, enabled status).
      security:
        - Bearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
                role:
                  type: string
                  enum: [USER, ADMIN]
                enabled:
                  type: boolean
      responses:
        "200":
          description: User updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /admin/users/{id}/ban:
    post:
      tags: [Admin]
      summary: Update user ban status
      description: Ban or unban a user.
      security:
        - Bearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [banned]
              properties:
                banned:
                  type: boolean
                  description: True to ban, false to unban
                reason:
                  type: string
                  description: Reason for ban (required if banned is true)
      responses:
        "200":
          description: Ban status updated

  /admin/items:
    get:
      tags: [Admin]
      summary: List all items
      security:
        - Bearer: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Item"

  /admin/items/{id}:
    delete:
      tags: [Admin]
      summary: Delete an item (Admin)
      security:
        - Bearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: Deleted

  /admin/statistics:
    get:
      tags: [Admin]
      summary: Get statistics
      security:
        - Bearer: []
      parameters:
        - name: startDate
          in: query
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          schema:
            type: string
            format: date
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalSales:
                    type: number
                  orderCountByStatus:
                    type: object
                    additionalProperties:
                      type: integer

  /admin/complaints:
    get:
      tags: [Admin]
      summary: List user complaints
      security:
        - Bearer: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserComplaint"

  /admin/export/csv:
    get:
      tags: [Admin]
      summary: Export data as CSV
      security:
        - Bearer: []
      parameters:
        - name: type
          in: query
          schema:
            type: string
            enum: [sales, users, items]
        - name: startDate
          in: query
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          schema:
            type: string
            format: date
      responses:
        "200":
          description: CSV file download
          content:
            text/csv:
              schema:
                type: string
                format: binary

components:
  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [USER, ADMIN]
        enabled:
          type: boolean
        banned:
          type: boolean
        banReason:
          type: string
        bannedAt:
          type: string
          format: date-time
        bannedByAdminId:
          type: integer
          format: int64
      required:
        - id
        - name
        - email
        - role
        - enabled
        - banned

    Item:
      type: object
      properties:
        id:
          type: integer
          format: int64
        seller:
          $ref: "#/components/schemas/User"
        name:
          type: string
        description:
          type: string
        price:
          type: number
        category:
          $ref: "#/components/schemas/Category"
        status:
          type: string
          description: "e.g. '出品中', '購入済'"
          example: "出品中"
        imageUrl:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - seller
        - name
        - price
        - status
        - createdAt

    Category:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
      required:
        - id
        - name

    AppOrder:
      type: object
      properties:
        id:
          type: integer
          format: int64
        item:
          $ref: "#/components/schemas/Item"
        buyer:
          $ref: "#/components/schemas/User"
        price:
          type: number
        status:
          type: string
          description: "e.g. '購入済', '発送済', '受取済'"
          example: "購入済"
        paymentIntentId:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - item
        - buyer
        - price
        - status
        - createdAt

    Chat:
      type: object
      properties:
        id:
          type: integer
          format: int64
        item:
          $ref: "#/components/schemas/Item"
        sender:
          $ref: "#/components/schemas/User"
        message:
          type: string
        sentAt:
          type: string
          format: date-time
      required:
        - id
        - item
        - sender
        - message
        - sentAt

    Review:
      type: object
      properties:
        id:
          type: integer
          format: int64
        order:
          $ref: "#/components/schemas/AppOrder"
        reviewer:
          $ref: "#/components/schemas/User"
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - order
        - reviewer
        - rating
        - createdAt

    UserComplaint:
      type: object
      properties:
        id:
          type: integer
          format: int64
        reportedUser:
          $ref: "#/components/schemas/User"
        reporterUser:
          $ref: "#/components/schemas/User"
        reason:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - reportedUser
        - reporterUser
        - reason

  securitySchemes:
    Bearer:
      type: http
      scheme: bearer
      description: API Key authentication via Bearer token
