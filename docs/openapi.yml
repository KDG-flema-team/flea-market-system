openapi: 3.0.3
info:
  title: Flea Market System API
  version: 1.0.0
  description: |
    API definition for the Flea Market Matching Application.
    Provides endpoints for users (buyers/sellers) and administrators.
servers:
  - url: http://localhost:8080/api/v1
    description: Local Development Server

paths:
  # ============================
  # My Page Endpoints
  # ============================
  /my-page:
    get:
      tags: [MyPage]
      summary: Get my profile
      description: Returns the authenticated user's profile information.
      security:
        - Bearer: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

    post:
      tags: [MyPage]
      summary: Update profile
      description: Update user name and profile image.
      security:
        - Bearer: []
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                name:
                  type: string
                profileImage:
                  type: string
                  format: binary
                  description: Profile image file
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  isSuccess:
                    type: boolean
                  errorMessage:
                    type: string

  /my-page/orders:
    get:
      tags: [MyPage]
      summary: Get purchase history
      description: Returns a list of items purchased by the user.
      security:
        - Bearer: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  orders:
                    type: array
                    items:
                      $ref: "#/components/schemas/AppOrder"

  /my-page/sales:
    get:
      tags: [MyPage]
      summary: Get sales history
      description: Returns a list of items sold by the user.
      security:
        - Bearer: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  records:
                    type: array
                    items:
                      $ref: "#/components/schemas/AppOrder"

  /my-page/selling:
    get:
      tags: [MyPage]
      summary: Get selling items
      description: Returns items currently listed by the user.
      security:
        - Bearer: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  sellingItems:
                    type: array
                    items:
                      $ref: "#/components/schemas/Item"

  /my-page/sold:
    get:
      tags: [MyPage]
      summary: Get sold items
      description: Returns items that have been sold by the user.
      security:
        - Bearer: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  soldItems:
                    type: array
                    items:
                      $ref: "#/components/schemas/Item"

  /my-page/favorites:
    get:
      tags: [MyPage]
      summary: Get favorite items
      description: Returns a list of items favorited by the user.
      security:
        - Bearer: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  favoriteItems:
                    type: array
                    items:
                      $ref: "#/components/schemas/Item"
    post:
      tags: [MyPage]
      summary: Add to favorites
      security:
        - Bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                itemId:
                  type: integer
                  format: int64
      responses:
        "200":
          description: OK
    delete:
      tags: [MyPage]
      summary: Remove from favorites
      security:
        - Bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                itemId:
                  type: integer
                  format: int64
      responses:
        "200":
          description: OK

  # ============================
  # Item Endpoints
  # ============================
  /items:
    get:
      tags: [Items]
      summary: Search items
      description: Retrieve a list of items with optional filters.
      parameters:
        - name: keyword
          in: query
          schema:
            type: string
          description: Search keyword for item name or description.
        - name: categoryId
          in: query
          schema:
            type: integer
            format: int64
          description: Filter by category ID.
        - name: minPrice
          in: query
          schema:
            type: number
          description: Minimum price filter.
        - name: maxPrice
          in: query
          schema:
            type: number
          description: Maximum price filter.
        - name: status
          in: query
          schema:
            type: string
            enum: [出品中, 販売済]
          description: Filter by item status.
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Item"
                  totalPages:
                    type: integer
                  currentPage:
                    type: integer
                  totalItems:
                    type: integer

    post:
      tags: [Items]
      summary: Create new item
      security:
        - Bearer: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [name, price, categoryId]
              properties:
                name:
                  type: string
                description:
                  type: string
                price:
                  type: number
                categoryId:
                  type: integer
                  format: int64
                image:
                  type: string
                  format: binary
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"

  /items/{id}:
    get:
      tags: [Items]
      summary: Get item details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
        "404":
          description: Not Found

    put:
      tags: [Items]
      summary: Update item
      security:
        - Bearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                price:
                  type: number
                categoryId:
                  type: integer
                  format: int64
                image:
                  type: string
                  format: binary
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"

    delete:
      tags: [Items]
      summary: Delete item
      security:
        - Bearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: Deleted

  /items/{id}/favorite:
    post:
      tags: [Items]
      summary: Add to favorites (by ID)
      security:
        - Bearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: OK
    delete:
      tags: [Items]
      summary: Remove from favorites (by ID)
      security:
        - Bearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: OK

  /items/{id}/report:
    post:
      tags: [Items]
      summary: Report a user/item
      description: Report the seller of this item for inappropriate behavior.
      security:
        - Bearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  description: Reason for the report
      responses:
        "200":
          description: Report submitted

  /home:
    get:
      tags: [Home]
      summary: Get home redirect info
      description: Returns the role and recommended redirect path for the current user.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomeResponse"

  # ============================
  # Order Endpoints
  # ============================
  /orders:
    get:
      tags: [Orders]
      summary: Get all orders (admin or user context)
      security:
        - Bearer: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AppOrder"

    post:
      tags: [Orders]
      summary: Create an order (Purchase item)
      security:
        - Bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [itemId]
              properties:
                itemId:
                  type: integer
                  format: int64
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppOrder"

  /orders/{id}/ship:
    post:
      tags: [Orders]
      summary: Mark order as shipped
      security:
        - Bearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Shipped

  /orders/{id}/receive:
    post:
      tags: [Orders]
      summary: Confirm order receipt
      description: Mark the order as received by the buyer.
      security:
        - Bearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Received

  # ============================
  # Additional Order Endpoints
  # ============================
  /orders/initiate:
    post:
      tags: [Orders]
      summary: Initiate purchase (create PaymentIntent)
      description: Creates a Stripe PaymentIntent and returns client secret.
      security:
        - Bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [itemId]
              properties:
                itemId:
                  type: integer
                  format: int64
      responses:
        "200":
          description: Payment initiated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentInitiateResponse"

  /orders/complete:
    post:
      tags: [Orders]
      summary: Complete purchase
      description: Finalize purchase after client-side confirmation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [paymentIntentId]
              properties:
                paymentIntentId:
                  type: string
      responses:
        "200":
          description: Purchase completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /orders/stripe-webhook:
    post:
      tags: [Orders]
      summary: Stripe webhook endpoint
      description: Endpoint for receiving Stripe webhook events. Signature header `Stripe-Signature` is expected.
      requestBody:
        required: true
        content:
          text/plain:
            schema:
              type: string
      parameters:
        - name: Stripe-Signature
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Webhook received

  # Review & Chat Endpoints
  # ============================
  /reviews:
    post:
      tags: [Reviews]
      summary: Post a review
      security:
        - Bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderId, rating]
              properties:
                orderId:
                  type: integer
                  format: int64
                rating:
                  type: integer
                  minimum: 1
                  maximum: 5
                comment:
                  type: string
      responses:
        "200":
          description: Review submitted

  # ============================
  # Star (Rating) Endpoints
  # ============================
  /stars:
    post:
      tags: [Stars]
      summary: Create a star (rating) for a user
      description: Create a rating and optional comment about a target user.
      security:
        - Bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StarRequest"
      responses:
        "200":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StarResponse"

  /stars/{targetUserId}:
    get:
      tags: [Stars]
      summary: Get stars for a user
      description: Returns a list of ratings given to the target user.
      parameters:
        - name: targetUserId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StarResponse"

  /stars/{targetUserId}/stats:
    get:
      tags: [Stars]
      summary: Get rating statistics for a user
      description: Returns average rating and total number of ratings for the target user.
      parameters:
        - name: targetUserId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StarStatsResponse"

  /stars/{starId}:
    put:
      tags: [Stars]
      summary: Update a star rating
      description: Update the rating and comment for a star rating created by the authenticated user.
      security:
        - Bearer: []
      parameters:
        - name: starId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StarRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StarResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

    delete:
      tags: [Stars]
      summary: Delete a star rating
      description: Delete a star rating created by the authenticated user.
      security:
        - Bearer: []
      parameters:
        - name: starId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /chat/{itemId}:
    get:
      tags: [Chat]
      summary: Get chat messages for an item
      security:
        - Bearer: []
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Chat"

    post:
      tags: [Chat]
      summary: Send a chat message
      security:
        - Bearer: []
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
      responses:
        "200":
          description: Message sent

  # ============================
  # Admin Endpoints
  # ============================
  /admin/users:
    get:
      tags: [Admin]
      summary: List users
      security:
        - Bearer: []
      parameters:
        - name: q
          in: query
          schema:
            type: string
        - name: sort
          in: query
          schema:
            type: string
            enum: [id, name, email, banned]
            default: id
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"

  /admin/users/{id}:
    get:
      tags: [Admin]
      summary: Get user details
      security:
        - Bearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

    post:
      tags: [Admin]
      summary: Update user details
      description: Update user information (name, email, role, enabled status).
      security:
        - Bearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
                role:
                  type: string
                  enum: [USER, ADMIN]
                enabled:
                  type: boolean
      responses:
        "200":
          description: User updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /admin/users/{id}/ban:
    post:
      tags: [Admin]
      summary: Update user ban status
      description: Ban or unban a user.
      security:
        - Bearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [banned]
              properties:
                banned:
                  type: boolean
                  description: True to ban, false to unban
                reason:
                  type: string
                  description: Reason for ban (required if banned is true)
      responses:
        "200":
          description: Ban status updated

  /admin/items:
    get:
      tags: [Admin]
      summary: List all items
      security:
        - Bearer: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Item"

  /admin/items/{id}:
    delete:
      tags: [Admin]
      summary: Delete an item (Admin)
      security:
        - Bearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: Deleted

  /admin/statistics:
    get:
      tags: [Admin]
      summary: Get statistics
      security:
        - Bearer: []
      parameters:
        - name: startDate
          in: query
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          schema:
            type: string
            format: date
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalSales:
                    type: number
                  orderCountByStatus:
                    type: object
                    additionalProperties:
                      type: integer

  /admin/complaints:
    get:
      tags: [Admin]
      summary: List user complaints
      security:
        - Bearer: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserComplaint"

  /admin/export/csv:
    get:
      tags: [Admin]
      summary: Export data as CSV
      security:
        - Bearer: []
      parameters:
        - name: type
          in: query
          schema:
            type: string
            enum: [sales, users, items]
        - name: startDate
          in: query
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          schema:
            type: string
            format: date
      responses:
        "200":
          description: CSV file download
          content:
            text/csv:
              schema:
                type: string
                format: binary

  /admin/statistics/csv:
    get:
      tags: [Admin]
      summary: Export statistics as CSV
      description: Export aggregated sales/statistics as CSV file.
      security:
        - Bearer: []
      parameters:
        - name: startDate
          in: query
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          schema:
            type: string
            format: date
      responses:
        "200":
          description: CSV file download
          content:
            text/csv:
              schema:
                type: string
                format: binary

  /admin/notifications:
    get:
      tags: [Admin]
      summary: List all notifications
      description: Get a list of all notifications created by administrators.
      security:
        - Bearer: []
      parameters:
        - name: page
          in: query
          description: Page number for pagination.
          required: false
          schema:
            type: integer
            format: int32
            default: 0
            minimum: 0
        - name: size
          in: query
          description: Number of notifications per page.
          required: false
          schema:
            type: integer
            format: int32
            default: 20
            minimum: 1
            maximum: 100
        - name: category
          in: query
          description: Filter by notification category.
          required: false
          schema:
            type: string
        - name: isImportant
          in: query
          description: Filter by importance status.
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  notifications:
                    type: array
                    items:
                      $ref: "#/components/schemas/AdminNotification"
                  totalPages:
                    type: integer
                  currentPage:
                    type: integer
                  totalItems:
                    type: integer
                required:
                  - notifications
                  - totalPages
                  - currentPage
                  - totalItems

    post:
      tags: [Admin]
      summary: Create a notification
      description: Create a notification to be sent to users.
      security:
        - Bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message, category]
              properties:
                message:
                  type: string
                  description: User-facing notification text.
                  minLength: 1
                  maxLength: 500
                isImportant:
                  type: boolean
                  description: If true, the notification is marked as important.
                  default: false
                linkUrl:
                  type: string
                  description: Optional URL for deep linking from the notification.
                  maxLength: 2000
                category:
                  type: string
                  description: Logical category of the notification (e.g., order, chat, admin).
                  enum: [order, chat, admin, system, promotion]
                targetUserIds:
                  type: array
                  description: Optional list of specific user IDs to send the notification to. If not provided, notification is sent to all users.
                  items:
                    type: integer
                    format: int64
      responses:
        "201":
          description: Notification created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminNotification"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /admin/notifications/{id}:
    get:
      tags: [Admin]
      summary: Get notification details
      description: Get details of a specific notification including delivery statistics.
      security:
        - Bearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminNotificationDetail"
        "404":
          description: Not Found

    put:
      tags: [Admin]
      summary: Update a notification
      description: Update a notification's content. Only unread notifications can be updated.
      security:
        - Bearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  description: Updated notification text.
                  minLength: 1
                  maxLength: 500
                isImportant:
                  type: boolean
                  description: Updated importance status.
                linkUrl:
                  type: string
                  description: Updated URL for deep linking.
                  maxLength: 2000
                category:
                  type: string
                  description: Updated category.
                  enum: [order, chat, admin, system, promotion]
      responses:
        "200":
          description: Notification updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminNotification"
        "400":
          description: Bad Request - Cannot update notification that has been read
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        "404":
          description: Not Found

    delete:
      tags: [Admin]
      summary: Delete a notification
      description: Delete a notification. This will remove it for all users.
      security:
        - Bearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: Notification deleted
        "404":
          description: Not Found

  /notifications:
    get:
      tags: [Notification]
      summary: Get notifications
      description: Returns notifications for the authenticated user with cursor-based pagination.
      security:
        - Bearer: []
      parameters:
        - name: startId
          in: query
          description: ID to start listing from (exclusive). Use the previous response's nextStartId.
          required: false
          schema:
            type: integer
            format: int64
        - name: limit
          in: query
          description: Number of notifications to return.
          required: false
          schema:
            type: integer
            format: int32
            default: 20
            minimum: 1
            maximum: 50
        - name: onlyUnread
          in: query
          description: If true, returns only unread notifications.
          required: false
          schema:
            type: boolean
        - name: category
          in: query
          description: Filter by notification category.
          required: false
          schema:
            type: string
            enum: [order, chat, admin, system, promotion]
        - name: isImportant
          in: query
          description: Filter by importance status.
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationListResponse"

  /notifications/unread-count:
    get:
      tags: [Notification]
      summary: Get unread notification count
      description: Returns the total number of unread notifications for the authenticated user.
      security:
        - Bearer: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  unreadCount:
                    type: integer
                    format: int32
                    description: Total number of unread notifications.
                required:
                  - unreadCount

  /notifications/read-all:
    post:
      tags: [Notification]
      summary: Mark all notifications as read
      description: Mark all unread notifications as read for the authenticated user.
      security:
        - Bearer: []
      responses:
        "200":
          description: All notifications marked as read
          content:
            application/json:
              schema:
                type: object
                properties:
                  updatedCount:
                    type: integer
                    format: int32
                    description: Number of notifications marked as read.
                required:
                  - updatedCount

  /notifications/{id}:
    get:
      tags: [Notification]
      summary: Get notification details
      description: Get details of a specific notification.
      security:
        - Bearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"
        "404":
          description: Not Found

    delete:
      tags: [Notification]
      summary: Delete a notification
      description: Delete a notification for the authenticated user.
      security:
        - Bearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: Notification deleted
        "404":
          description: Not Found

  /notifications/{id}/read:
    patch:
      tags: [Notification]
      summary: Mark notification as read
      description: Mark a specific notification as read.
      security:
        - Bearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Notification marked as read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"
        "404":
          description: Not Found


components:
  schemas:
    Notification:
      type: object
      properties:
        id:
          type: integer
          format: int64
        message:
          type: string
          description: User-facing notification text.
        createdAt:
          type: string
          format: date-time
        readAt:
          type: string
          format: date-time
          nullable: true
          description: Timestamp when the notification was read.
        isRead:
          type: boolean
        isImportant:
          type: boolean
        linkUrl:
          type: string
          nullable: true
          description: Optional URL for deep linking from the notification.
        category:
          type: string
          description: Logical category of the notification.
          enum: [order, chat, admin, system, promotion]
      required:
        - id
        - message
        - createdAt
        - isRead
        - isImportant
        - category

    NotificationListResponse:
      type: object
      properties:
        notifications:
          type: array
          items:
            $ref: "#/components/schemas/Notification"
        nextStartId:
          type: integer
          format: int64
          nullable: true
          description: Use as startId to fetch the next page; null when there is no next page.
        hasMore:
          type: boolean
        unreadCount:
          type: integer
          format: int32
          description: Total unread notifications for the authenticated user.
      required:
        - notifications
        - hasMore
        - unreadCount

    AdminNotification:
      type: object
      properties:
        id:
          type: integer
          format: int64
        message:
          type: string
          description: User-facing notification text.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
          nullable: true
          description: Timestamp when the notification was last updated.
        isImportant:
          type: boolean
        linkUrl:
          type: string
          nullable: true
          description: Optional URL for deep linking from the notification.
        category:
          type: string
          description: Logical category of the notification.
          enum: [order, chat, admin, system, promotion]
        createdBy:
          type: integer
          format: int64
          description: ID of the admin user who created this notification.
        targetUserIds:
          type: array
          nullable: true
          description: List of specific user IDs if notification was targeted, null if sent to all users.
          items:
            type: integer
            format: int64
      required:
        - id
        - message
        - createdAt
        - isImportant
        - category
        - createdBy

    AdminNotificationDetail:
      allOf:
        - $ref: "#/components/schemas/AdminNotification"
        - type: object
          properties:
            deliveryStats:
              type: object
              description: Statistics about notification delivery and read status.
              properties:
                totalRecipients:
                  type: integer
                  format: int32
                  description: Total number of users who received this notification.
                readCount:
                  type: integer
                  format: int32
                  description: Number of users who have read this notification.
                unreadCount:
                  type: integer
                  format: int32
                  description: Number of users who have not read this notification.
                deletedCount:
                  type: integer
                  format: int32
                  description: Number of users who have deleted this notification.
              required:
                - totalRecipients
                - readCount
                - unreadCount
                - deletedCount
          required:
            - deliveryStats

    User:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [USER, ADMIN]
        enabled:
          type: boolean
        banned:
          type: boolean
        banReason:
          type: string
        bannedAt:
          type: string
          format: date-time
        bannedByAdminId:
          type: integer
          format: int64
      required:
        - id
        - name
        - email
        - role
        - enabled
        - banned

    Item:
      type: object
      properties:
        id:
          type: integer
          format: int64
        seller:
          $ref: "#/components/schemas/User"
        name:
          type: string
        description:
          type: string
        price:
          type: number
        category:
          $ref: "#/components/schemas/Category"
        status:
          type: string
          description: "e.g. '出品中', '購入済'"
          example: "出品中"
        imageUrl:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - seller
        - name
        - price
        - status
        - createdAt

    Category:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
      required:
        - id
        - name

    AppOrder:
      type: object
      properties:
        id:
          type: integer
          format: int64
        item:
          $ref: "#/components/schemas/Item"
        buyer:
          $ref: "#/components/schemas/User"
        price:
          type: number
        status:
          type: string
          description: "e.g. '購入済', '発送済', '受取済'"
          example: "購入済"
        paymentIntentId:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - item
        - buyer
        - price
        - status
        - createdAt

    Chat:
      type: object
      properties:
        id:
          type: integer
          format: int64
        item:
          $ref: "#/components/schemas/Item"
        sender:
          $ref: "#/components/schemas/User"
        message:
          type: string
        sentAt:
          type: string
          format: date-time
      required:
        - id
        - item
        - sender
        - message
        - sentAt

    Review:
      type: object
      properties:
        id:
          type: integer
          format: int64
        order:
          $ref: "#/components/schemas/AppOrder"
        reviewer:
          $ref: "#/components/schemas/User"
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - order
        - reviewer
        - rating
        - createdAt

    UserComplaint:
      type: object
      properties:
        id:
          type: integer
          format: int64
        reportedUser:
          $ref: "#/components/schemas/User"
        reporterUser:
          $ref: "#/components/schemas/User"
        reason:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - reportedUser
        - reporterUser
        - reason

    StarRequest:
      type: object
      properties:
        targetUserId:
          type: integer
          format: int64
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
          maxLength: 1000
      required:
        - targetUserId
        - rating

    StarResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        userId:
          type: integer
          format: int64
        userName:
          type: string
        targetUserId:
          type: integer
          format: int64
        targetUserName:
          type: string
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - userId
        - userName
        - targetUserId
        - targetUserName
        - rating
        - createdAt

    StarStatsResponse:
      type: object
      properties:
        averageRating:
          type: number
          format: double
        totalStars:
          type: integer
          format: int64
      required:
        - averageRating
        - totalStars

    PaymentInitiateResponse:
      type: object
      properties:
        clientSecret:
          type: string
        paymentIntentId:
          type: string
      required:
        - clientSecret
        - paymentIntentId

    MessageResponse:
      type: object
      properties:
        message:
          type: string
      required:
        - message

    HomeResponse:
      type: object
      properties:
        role:
          type: string
          description: Role of the current user (GUEST/USER/ADMIN)
        redirect:
          type: string
          description: URL path to redirect the user to
      required:
        - role
        - redirect

  securitySchemes:
    Bearer:
      type: http
      scheme: bearer
      description: API Key authentication via Bearer token
