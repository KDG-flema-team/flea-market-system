debug: true
server:
  port: 8080

# OAuth2設定（SNS認証用）
spring:
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:your-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:your-google-client-secret}
            scope:
              - email
              - profile
          github:
            client-id: ${GITHUB_CLIENT_ID:your-github-client-id}
            client-secret: ${GITHUB_CLIENT_SECRET:your-github-client-secret}
            scope:
              - user:email
              - read:user
      resourceserver:
        jwt:
          issuer-uri: https://dev-3hpu1z5igskz6tna.us.auth0.com/
          jwk-set-uri: https://dev-3hpu1z5igskz6tna.us.auth0.com/.well-known/jwks.json
          audiences: flea-market-system
