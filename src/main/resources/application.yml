debug: true
server:
  port: 8080

# JWT設定
jwt:
  secret: mySecretKeyForJwtTokenGenerationAndValidation12345678901234567890
  expiration: 86400000 # 24 hours in milliseconds

# OAuth2設定（SNS認証用）
spring:
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:your-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:your-google-client-secret}
            scope:
              - email
              - profile
          github:
            client-id: ${GITHUB_CLIENT_ID:your-github-client-id}
            client-secret: ${GITHUB_CLIENT_SECRET:your-github-client-secret}
            scope:
              - user:email
              - read:user
          okta:
            client-id: ${OKTA_CLIENT_ID:wj7azFR2FCl5sj3lSDmzfPk7cAwLgS1w}
            client-secret: ${OKTA_CLIENT_SECRET:tM8Cjqzr2iw-s6J6cQuoL6QpKl93us_HKiLMHktueNiUdn2FNGrAfoErcMnHvP_k}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - openid
              - profile
              - email
        provider:
          okta:
            issuer-uri: https://dev-3hpu1z5igskz6tna.us.auth0.com/
      resourceserver:
        jwt:
          issuer-uri: https://dev-3hpu1z5igskz6tna.us.auth0.com/
          audiences: flea-market-system
