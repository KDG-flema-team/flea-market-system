<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
  <meta charset="UTF-8">
  <title>ログイン</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<main class="container">
  <h1>ログイン</h1>
  <form method="post" th:action="@{/login}">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
    <div class="field">
      <label>メール</label>
      <input type="text" name="username" required>
    </div>
    <div class="field">
      <label>パスワード</label>
      <input type="password" name="password" required>
    </div>
    <button type="submit">ログイン</button>
  </form>
  
  <div style="margin-top: 20px; padding-top: 20px; border-top: 1px solid #ccc;">
    <p>または、SNSアカウントでログイン：</p>
    <a th:href="@{/oauth2/authorization/okta}" style="display: inline-block; padding: 10px 20px; background-color: #0066cc; color: white; text-decoration: none; border-radius: 4px; margin-right: 10px;">
      Auth0でログイン
    </a>
    <a th:href="@{/oauth2/authorization/google}" style="display: inline-block; padding: 10px 20px; background-color: #db4437; color: white; text-decoration: none; border-radius: 4px; margin-right: 10px;">
      Googleでログイン
    </a>
    <a th:href="@{/oauth2/authorization/github}" style="display: inline-block; padding: 10px 20px; background-color: #333; color: white; text-decoration: none; border-radius: 4px;">
      GitHubでログイン
    </a>
  </div>
  
  <p th:if="${param.error}">ログインに失敗しました。</p>
  <p th:if="${param.logout}">ログアウトしました。</p>
</main>
</body>
</html>
