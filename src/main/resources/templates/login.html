<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
  <meta charset="UTF-8">
  <title>ログイン</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<main class="container">
  <h1>ログイン</h1>
  <p style="margin-bottom: 16px;">このアプリではメール/パスワードは使いません。以下のプロバイダーからログインしてください。</p>

  <div style="display: flex; gap: 12px; flex-wrap: wrap; margin-top: 12px;">
    <a th:href="@{/oauth2/authorization/google}" style="display: inline-block; padding: 10px 20px; background-color: #db4437; color: white; text-decoration: none; border-radius: 4px;">
      Googleでログイン
    </a>
    <a th:href="@{/oauth2/authorization/github}" style="display: inline-block; padding: 10px 20px; background-color: #333; color: white; text-decoration: none; border-radius: 4px;">
      GitHubでログイン
    </a>
  </div>

  <p style="margin-top: 12px;" th:if="${param.error}">ログインに失敗しました。別のプロバイダーをお試しください。</p>
  <p style="margin-top: 12px;" th:if="${param.logout}">ログアウトしました。</p>
</main>
</body>
</html>
